baseURL: https://outofmemry.github.io/webtuidb/
title: webtuidb
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: false

module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

defaultContentLanguage: en
languages:
  en:
    label: English
    weight: 1
    title: webtuidb

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: tokyonight-night
    lineNos: false

menu:
  main:
    - identifier: docs
      name: Docs
      pageRef: /docs
      weight: 1
    - identifier: reference
      name: Reference
      pageRef: /docs/reference
      weight: 2
    - identifier: shortcuts
      name: Shortcuts
      pageRef: /docs/reference/shortcuts
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: https://github.com/outofmemry/webtuidb
      params:
        icon: github

params:
  description: Documentation for webtuidb, a TablePlus-style database client for the terminal and the browser.
  navbar:
    displayTitle: true
    displayLogo: false
  page:
    width: wide
  theme:
    default: dark
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: normal
  displayUpdatedDate: true
  dateFormat: "2 January 2006"
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  editURL:
    enable: true
    base: https://github.com/outofmemry/webtuidb/edit/main/docs/content
  highlight:
    copy:
      enable: true
      display: hover
  toc:
    displayTags: false
  comments:
    enable: false
