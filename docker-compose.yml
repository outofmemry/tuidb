# Test databases for webtuidb. Non-default host ports so they never clash with real servers,
# bound to loopback so nothing on the network can reach them, and Redis needs a password.
# user/password/database are all "webtuidb" everywhere (mongo and clickhouse included).
name: webtuidb-test
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: webtuidb, POSTGRES_PASSWORD: webtuidb, POSTGRES_DB: webtuidb}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./testdata/seed/postgres.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U webtuidb -d webtuidb"], interval: 2s, timeout: 3s, retries: 30}
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_USER: webtuidb, MYSQL_PASSWORD: webtuidb, MYSQL_DATABASE: webtuidb}
    ports: ["127.0.0.1:53306:3306"]
    volumes: ["./testdata/seed/mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uwebtuidb -pwebtuidb --silent"], interval: 3s, timeout: 3s, retries: 40}
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment: {CLICKHOUSE_USER: webtuidb, CLICKHOUSE_PASSWORD: webtuidb, CLICKHOUSE_DB: webtuidb, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:58123:8123"]
    ulimits: {nofile: {soft: 262144, hard: 262144}}
    volumes: ["./testdata/seed/clickhouse.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "clickhouse-client -u webtuidb --password webtuidb -q 'SELECT 1'"], interval: 3s, timeout: 3s, retries: 40}
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "webtuidb"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "-a", "webtuidb", "ping"], interval: 2s, timeout: 3s, retries: 30}
  redis-seed:
    image: redis:7
    depends_on: {redis: {condition: service_healthy}}
    volumes: ["./testdata/seed/redis.txt:/seed/redis.txt:ro"]
    command: ["sh", "-c", "redis-cli -h redis -a webtuidb < /seed/redis.txt"]
    restart: "no"
  mongo:
    image: mongo:7
    environment: {MONGO_INITDB_ROOT_USERNAME: webtuidb, MONGO_INITDB_ROOT_PASSWORD: webtuidb, MONGO_INITDB_DATABASE: webtuidb}
    ports: ["127.0.0.1:57017:27017"]
    volumes: ["./testdata/seed/mongo.js:/docker-entrypoint-initdb.d/10-seed.js:ro"]
    healthcheck: {test: ["CMD-SHELL", "mongosh --quiet -u webtuidb -p webtuidb --authenticationDatabase admin --eval 'db.runCommand({ping:1}).ok' | grep 1"], interval: 3s, timeout: 5s, retries: 40}
  # Starting points for the later drivers: each driver's owner tunes its own block (image, auth, seed).
  mariadb:
    image: mariadb:11.4
    environment: {MARIADB_ROOT_PASSWORD: root, MARIADB_USER: webtuidb, MARIADB_PASSWORD: webtuidb, MARIADB_DATABASE: webtuidb}
    ports: ["127.0.0.1:53307:3306"]
    volumes: ["./testdata/seed/mariadb.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    healthcheck: {test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 3s, timeout: 3s, retries: 40}
  cassandra:
    image: cassandra:5.0
    ports: ["127.0.0.1:59042:9042"]
    environment: {MAX_HEAP_SIZE: 512M, HEAP_NEWSIZE: 128M}
    # The image has no env switches for these, so patch cassandra.yaml before starting: password login, plus the UDF and
    # materialized-view features the seed uses (both off by default). The healthcheck doubles as setup: it logs in as the
    # default superuser and creates webtuidb/webtuidb.
    command: ["sh", "-c", "sed -i -e 's/^authenticator:.*/authenticator: PasswordAuthenticator/' -e 's/^user_defined_functions_enabled:.*/user_defined_functions_enabled: true/' -e 's/^materialized_views_enabled:.*/materialized_views_enabled: true/' /etc/cassandra/cassandra.yaml && exec docker-entrypoint.sh cassandra -f"]
    healthcheck: {test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e \"CREATE ROLE IF NOT EXISTS webtuidb WITH PASSWORD = 'webtuidb' AND SUPERUSER = true AND LOGIN = true\""], interval: 10s, timeout: 20s, retries: 40}
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["127.0.0.1:58000:8000"]
    # no AWS credentials are checked by DynamoDB Local: the tests use the dummy pair webtuidb/webtuidb in us-east-1
    healthcheck: {test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000'"], interval: 3s, timeout: 3s, retries: 30}
