# Test databases for tuidb. Non-default host ports so they never clash with real servers,
# bound to loopback so nothing on the network can reach them, and Redis needs a password.
# user/password/database are all "tuidb" everywhere (mongo and clickhouse included).
name: tuidb-test
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: tuidb, POSTGRES_PASSWORD: tuidb, POSTGRES_DB: tuidb}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./testdata/seed/postgres.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U tuidb -d tuidb"], interval: 2s, timeout: 3s, retries: 30}
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_USER: tuidb, MYSQL_PASSWORD: tuidb, MYSQL_DATABASE: tuidb}
    ports: ["127.0.0.1:53306:3306"]
    volumes: ["./testdata/seed/mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -utuidb -ptuidb --silent"], interval: 3s, timeout: 3s, retries: 40}
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment: {CLICKHOUSE_USER: tuidb, CLICKHOUSE_PASSWORD: tuidb, CLICKHOUSE_DB: tuidb, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:58123:8123"]
    ulimits: {nofile: {soft: 262144, hard: 262144}}
    volumes: ["./testdata/seed/clickhouse.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "clickhouse-client -u tuidb --password tuidb -q 'SELECT 1'"], interval: 3s, timeout: 3s, retries: 40}
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "tuidb"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "-a", "tuidb", "ping"], interval: 2s, timeout: 3s, retries: 30}
  redis-seed:
    image: redis:7
    depends_on: {redis: {condition: service_healthy}}
    volumes: ["./testdata/seed/redis.txt:/seed/redis.txt:ro"]
    command: ["sh", "-c", "redis-cli -h redis -a tuidb < /seed/redis.txt"]
    restart: "no"
  mongo:
    image: mongo:7
    environment: {MONGO_INITDB_ROOT_USERNAME: tuidb, MONGO_INITDB_ROOT_PASSWORD: tuidb, MONGO_INITDB_DATABASE: tuidb}
    ports: ["127.0.0.1:57017:27017"]
    volumes: ["./testdata/seed/mongo.js:/docker-entrypoint-initdb.d/10-seed.js:ro"]
    healthcheck: {test: ["CMD-SHELL", "mongosh --quiet -u tuidb -p tuidb --authenticationDatabase admin --eval 'db.runCommand({ping:1}).ok' | grep 1"], interval: 3s, timeout: 5s, retries: 40}
